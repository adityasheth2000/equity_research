management_promises:
  - said: "EPS growth of ~24% CAGR over FY22-26"
    when: 2026-05-01
    source: Investor presentations / earnings calls Q1-Q4 FY26
    status: kept
    note: EPS compounded from ₹25.1 (FY22) to ₹60.2 (FY26), a 24.5% CAGR.
  - said: "Lightweighting market share to scale from 10% toward 20%+"
    when: 2024-05-01
    source: Investor presentations FY24-FY26
    status: kept
    note: Share moved 10% (FY24) → 12.5% (FY25) → 14% (FY26); on track toward the 20%+ aspiration.
  - said: "3x lightweighting revenue from FY25 by FY28 based on orders already in hand"
    when: 2026-05-01
    source: Investor presentation May 2026
    status: pending
    note: ~$70M+ lifetime-value orders booked for Q1 FY28 SOP; revenue conversion is the test over FY27-28.
  - said: "Donghee TLA to add subframes and torsion beams, expanding content-per-vehicle from Rs 2K-8K to Rs 6K-18K"
    when: 2025-10-01
    source: Donghee TLA announcement Oct 2025
    status: pending
    note: TLA executed Oct 2025; first subframe/torsion beam RFQ win awaited.
  - said: "Export order from NA's largest engine/genset OEM ($7M+ annual)"
    when: 2025-05-01
    source: Investor presentation
    status: pending
    note: SOP delayed to Q3 FY27; export contribution still ~1% after 5+ years from first export aspiration (Q1 FY22).
  - said: "Margin compression is 'broadly in range', largely catalyst pass-through"
    when: 2026-05-01
    source: Q4 FY26 earnings call
    status: missed
    note: GP growth of 8% materially lagged revenue growth of 20% even after adjusting for catalyst pass-through; OPM down 320 bps in 6 quarters — severity understated.
  - said: "TREM V near-term opportunity on mufflers/integrated mufflers"
    when: 2025-05-01
    source: Investor presentation
    status: dropped
    note: No capex committed despite the Apr'26 formal deadline; management now acknowledges "change seems likely"; opportunity delayed indefinitely.
  - said: "JV with Purem as a growth driver for heavy CV emission systems"
    when: 2024-05-01
    source: Investor presentations
    status: missed
    note: Niche limited to M&HCV >4L engines; PAT contribution sub-scale at ~₹1 Cr/quarter for 2+ years.
  - said: "Buyback (FY25), 1:1 bonus, ₹32.5 dividend — sharing surplus while awaiting M&A"
    when: 2025-05-01
    source: Investor presentation / corporate actions
    status: kept
    note: All three shareholder-return actions executed; balance sheet remains debt-free with ₹991 Cr cash/investments.
  - said: "CRISIL AA-/Positive outlook maintained"
    when: 2025-07-01
    source: CRISIL rating rationale Jul 2025
    status: kept
    note: AA-/Positive maintained since Apr'24; A1+ short-term rating also intact; no upgrade yet.

governance_flags:
  - Promoter stake reduced from 73.2% to 64.3% (~9% sold) in the Jun'24 quarter, timed near the stock's peak and preceding a ~30% correction.
  - Management consistently framed margin compression as "broadly in range" / catalyst pass-through while OPM fell 320 bps in 6 quarters — investors may view this as underplaying severity.
  - ₹991 Cr is parked in liquid/non-current investments earning sub-operating-ROCE returns; capital-allocation risk if surplus cash is not deployed into accretive M&A.
  - GST search (Mar'25) resulted in a ₹6.05 Cr deposit — no material impact but a compliance overhang being monitored by CRISIL.
  - Working capital swung from -16 days (FY25) to +78 days (FY26) — receivables, inventory and payables all expanded sharply; partly growth-driven but unverified.
  - Chronic export gestation — first export target set in Q1 FY22 with first material order now pushed to Q3 FY27, a 5+ year gap between aspiration and revenue.

latest_review:
  date: 2026-07-19
  new_since_last: >
    First full analysis. Captured FY26 full-year results (revenue ₹3,397 Cr +20%,
    EBITDA margin 12.3%, PAT ₹345 Cr, EPS ₹60.2), the 320 bps OPM compression over
    six quarters, the Donghee TLA (Oct 2025), $200M+ lifetime-value order book, the
    Jun'24 promoter stake reduction, working-capital swing to +78 days, peer
    comparison showing 14.5x P/E vs 30x median, and CRISIL AA-/Positive rating
    status.
  changed_my_view: >
    Stripped the thesis to two sell-trigger pillars: the lightweighting 3x ramp
    (diversification away from ICE) and margin stabilisation at a ~12% floor
    (quality-compounder validation). Exports, Donghee subframe wins and cash
    deployment are nice-to-haves that support re-rating but would not, alone, force
    an exit — they belong in monitorables, not pillars.
  next_check: Q1 FY27 results — gross margin stabilisation above 22%, EBITDA margin floor vs the 11% falsifier, and lightweighting revenue share vs the 15% threshold.
  open_questions:
    - Is the 320 bps OPM erosion truly mix-driven and transitory, or the start of structural margin pressure from growing lower-margin lightweighting and export working-capital drag?
    - Will the Q1 FY28 lightweighting SOP orders hold their timeline, or slip and break the 3x FY28 claim?
    - Can the Donghee TLA convert into a first subframe/torsion beam RFQ win within FY27-28, and will the $7M NA engine order actually SOP in Q3 FY27 despite the 26% US reciprocal tariff overhang?

history:
  - date: 2026-07-19
    note: Initial verdict — quality compounder at a cyclical-trough 14.5x P/E; thesis gated by margin stabilisation, lightweighting 3x ramp, and export order conversion.
  - date: 2026-07-19
    note: Thesis distilled to 2 sell-trigger pillars (lightweighting 3x ramp; margin floor ~12%) — exports, Donghee and cash deployment demoted to monitorables.
