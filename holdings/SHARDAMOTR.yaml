thesis:
  summary: >
    SMIL is a debt-free PV/LCV exhaust leader (~30% share) and the fastest-growing
    lightweighting player (control-arm share 10%→14% in 2 yrs), trading at 14.5x P/E
    vs a 30x peer median. Exhaust is 87% of revenue today; the bull case is that the
    lightweighting ramp and regulatory tailwinds (CAFE III, BS7) diversify the mix
    while margins re-stabilise, closing the valuation gap.
  bull:
    - Lightweighting share doubled to 14% in two years with ~$70M+ lifetime-value orders booked for Q1 FY28 SOP, underpinning the 3x FY28 ramp.
    - 36% ROCE, debt-free (₹49 Cr borrowings on ₹1,313 Cr net worth), 20% FY26 revenue growth and 1.9% yield at 14.5x P/E — cheapest in a 124-company peer set.
    - Gross margin held 22-23% through H2 FY26 despite mix shift, consistent with compression being transitory rather than structural.
  bear:
    - OPM compressed 320 bps in 6 quarters (14.8% Sep'24 → 11.6% Mar'26); FY26 GP growth of 8% lagged 20% revenue growth even after adjusting catalyst pass-through.
    - 87% of revenue is ICE-tied exhaust; top-2 customers ~75% of exhaust revenue and SMIL does not supply Maruti (~40% of PV market).
    - Promoter stake cut 73.2%→64.3% in Jun'24 near the peak, preceding a ~30% correction; working-capital days swung from -16 to +78.
  pillars:
    - claim: Lightweighting revenue will 3x from FY25 levels by FY28, lifting its share above 20% of revenue, on orders already booked.
      falsifier: Lightweighting revenue share stays below 15% through FY27, or any Q1 FY28 SOP order slips beyond FY28.
      status: intact
    - claim: The 320 bps OPM compression is mix/transitory, not structural competitive pressure — EBITDA margin floor is ~12%.
      falsifier: EBITDA margin prints below 11% in any FY27 quarter, or gross margin fails to stabilise above 22% by H1 FY27.
      status: weakening

monitorables:
  - what: Lightweighting revenue share
    why: Core ramp metric for pillar 1; management targets 15%+ by FY27 on the way to 3x by FY28.
    threshold: 15
  - what: Q1 FY28 SOP order pipeline execution
    why: Pillar 1 falsifier — any slip beyond FY28 breaks the 3x claim.
    threshold: null
  - what: EBITDA margin
    why: Pillar 2 falsifier — a print below 11% in any FY27 quarter signals structural compression.
    threshold: 11
  - what: Gross margin
    why: Pillar 2 falsifier — must stabilise above 22% by H1 FY27 to confirm compression is mix-driven.
    threshold: 22

