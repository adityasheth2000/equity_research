governance_flags:
  - "73.06% promoter holding with Chairman and MD/CEO in place since 1991/1994"
  - "Minimal institutional investor engagement (FII 0.63%, DII 0.33%)"
  - "SEBI clarification on related-party disclosures in FY25"
  - "Amalgamation of promoter-owned subsidiary GatIL Properties framed as simplification"
  - "No succession plan discussed publicly despite reliance on Chairman Dipak Patel and MD Shekhar Patel"
  - "Dated credit rating — only brickwork rating from March 2023 visible; no recent CRISIL/ICRA/CARE ratings"

latest_review:
  date: 2026-07-22
  new_since_last: >-
    FY26 full-year results confirming the -47% PAT trough; Million Minds Phase 1
    inauguration (May 2026); Rs 150 Cr LRD plus Rs 149 Cr unsecured loans marking
    a shift from the zero-debt philosophy; cumulative One 91 Thaltej delay of
    ~12-15 months; Malabar Retreat bookings stalled at ~35-37%.
  changed_my_view: >-
    Management's FY26 guidance miss (30% growth → 47% decline) is a significant
    credibility dent — the business quality (land bank, balance sheet, margins)
    is strong but the question is whether management can translate it into
    consistent, guided financial performance. Pillars are now narrowly scoped to
    land bank monetisation value, FY27 PAT recovery, and Million Minds lease
    conversion — the three things that, if they break, the thesis is dead.
  next_check: "Q1 FY27 results due late July 2026 — FY27 revenue/PAT guidance, One 91 Thaltej launch timeline, and Million Minds lease conversion status."
  open_questions:
    - "Will FY27 actually recover to ≥ Rs 450 Cr PAT, or is FY26 a new normal?"
    - "Can Million Minds convert 60-65% non-binding LOIs to binding leases at ~Rs 75+ Cr p.a. for Phase 1?"
    - "Will Godhavi realisations hold at ≥ Rs 10 Cr/acre as Phase 1 balance and Phase 2 launch?"

