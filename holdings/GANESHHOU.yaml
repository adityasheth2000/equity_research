thesis:
  summary: >-
    Debt-free Ahmedabad real estate developer (30+ year track record, 518-acre
    fully paid land bank, ~32 msf pipeline) coming off an FY26 earnings trough
    (-47% PAT). The thesis is buying the trough: FY27 should recover on Million
    Minds annuity income, Malabar Retreat completion, and Godhavi land
    monetisation. Trades cheapest in peer set at 21.5x trailing P/E — but only
    cheap if FY27 actually recovers.
  bull:
    - "518 acres of fully paid land in Ahmedabad's prime corridors, worth multiples
      of the Rs 6,793 Cr market cap at current realisations (~Rs 14.1 Cr/acre
      Godhavi average)."
    - "Million Minds Phase 1 (0.85 msf) inaugurated May 2026, 60-65% pre-leased via
      LOIs at ~Rs 75+ Cr p.a. rental — first true annuity stream with 5-7 future
      phases (Rs 500+ Cr p.a. potential)."
    - "FY27 recovery setup: Million Minds lease income from Q3 FY27, Malabar
      Retreat completion (~Rs 450-500 Cr revenue), and continued Godhavi land
      monetisation converge."
  bear:
    - "FY26 guidance miss (30% growth → 47% decline) and repeated One 91 Thaltej
      launch delays (~12-15 months cumulative) signal an execution/credibility
      problem."
    - "Single-city (100% Ahmedabad) concentration and lumpy project-completion
      revenue recognition create multi-quarter dry spells; no FY27 revenue
      guidance yet."
    - "83% OPM is unsustainable at scale — new land at market prices plus a
      development-led mix shift (37-40% margins) will compress blended margins
      materially."
  pillars:
    - claim: >-
        The 518-acre land bank is worth multiples of the Rs 6,793 Cr market cap,
        monetisable at ≥ Rs 12 Cr/acre (Godhavi avg ~Rs 14.1 Cr/acre).
      falsifier: >-
        Godhavi realisations fall below Rs 10 Cr/acre, or Phase 1 balance (4
        acres) remains unsold past Q4 FY27 (Mar 2027).
      status: intact
    - claim: >-
        FY27 PAT recovers to ≥ Rs 450 Cr (vs FY26 Rs 316 Cr), validating the
        trough-earnings entry at 21.5x trailing P/E.
      falsifier: >-
        Q1 FY27 (late Jul 2026) guidance implies FY27 PAT < Rs 400 Cr, or H1 FY27
        PAT run-rate is < Rs 200 Cr by Sep 2026.
      status: intact
    - claim: >-
        Million Minds Phase 1 LOIs convert to binding leases and ≥ Rs 50 Cr p.a.
        rental income commences by Q3 FY27.
      falsifier: >-
        LOI conversion drops below 50% of leasable area, or rental commencement
        slips beyond Q4 FY27 (Mar 2027).
      status: intact

monitorables:
  - what: "Godhavi land monetisation — realisations per acre and Phase 1 balance (4 acres) sale"
    why: "Tests pillar 1 — embedded land bank value must monetise at ≥ Rs 10 Cr/acre."
    threshold: 10
  - what: "FY27 PAT guidance (Q1 FY27 call, late Jul 2026) and H1 FY27 run-rate"
    why: "Tests pillar 2 — recovery must be ≥ Rs 450 Cr or the trough-entry thesis breaks."
    threshold: 450
  - what: "Million Minds Phase 1 LOI-to-lease conversion and rental commencement"
    why: "Tests pillar 3 — annuity thesis dies if LOIs don't convert to ≥ 50% binding leases."
    threshold: 50

