thesis:
  summary: >-
    Wood adhesives maker (Euro 7000 brand, #2 India retail) with proven Gujarat
    dominance (~35% share), zero-debt balance sheet, and strong capital
    efficiency (ROCE 36.5%, FAT 6.3x). Thesis is that the carpenter-loyalty
    distribution moat and the new brand push can replicate Gujarat's success
    pan-India — but FY26 saw growth decelerate (3yr CAGR 6.4%), margins
    compress (EBITDA 33%→27%), and debtor days balloon to 185. FY27 is the
    inflection test on volume growth, working capital discipline, and VAM
    pass-through.
  bull:
    - "Carpenter-loyalty flywheel (3.5L+ carpenters reached, 2L+ registered, 60% active) creates a bottom-up influencer moat in a category where carpenters are the decision-makers."
    - "Zero-debt, capital-efficient model (ROCE 36.5%, FAT 6.3x) with brownfield 2,000→3,500 TPM for just Rs 5-7 Cr supports the volume-growth leg without straining the balance sheet."
    - "Gujarat proven at ~35% share over 15+ years; 14-state footprint extended with Odisha/Chhattisgarh (May 2026), giving the replication thesis a real running start."
  bear:
    - "3yr revenue CAGR only 6.4% vs 5yr 25.4%; FY26 PAT fell 5.3% (Rs 74→70 Cr) and full-year growth was rescued by a single strong Q4."
    - "Ad/branding spend nearly tripled (2%→4% of revenue, targeting 6-7%) while FY26 volume grew only ~8% — brand-spend ROI unproven."
    - "Debtor days ballooning 133→161→185 with management guiding 120; new states (UP, WB, Karnataka) structurally demand higher credit, risking the working-capital leg."
  pillars:
    - claim: "The carpenter-loyalty distribution moat can replicate Gujarat's ~35% share in new states, with each new state reaching break-even within 3 years of entry."
      falsifier: "Any state onboarded before FY26 fails to reach break-even (positive contribution margin) by FY28, OR new-state counter additions grow <10% YoY through FY27."
      status: intact
    - claim: "Elevated brand/distribution spend (4%→6-7% of revenue) will lift volume growth to 15%+ within FY27."
      falsifier: "FY27 full-year volume growth stays below 12% despite ad spend at or above 6% of revenue."
      status: weakening
    - claim: "Working-capital discipline holds — debtor days revert to ≤150 by end of FY27 despite new-state expansion."
      falsifier: "Debtor days cross 200 in any FY27 quarter, or show no downward trajectory by Q4 FY27."
      status: weakening

monitorables:
  - what: "FY27 full-year volume growth (YoY)"
    why: "Directly tests Pillar 2 — whether brand spend converts to the 15%+ growth needed to justify margin investment."
    threshold: 15
  - what: "Ad/branding spend as % of revenue (FY27)"
    why: "Confirms Pillar 2's input side — spend must stay ≥6% for the test to be meaningful; lower spend invalidates the test rather than the pillar."
    threshold: 6
  - what: "Debtor days (quarterly)"
    why: "Tests Pillar 3 — working-capital discipline under new-state expansion; guide is 120, structural break at 200."
    threshold: 150
  - what: "New-state break-even / counter-onboarding progress (UP, Delhi, WB, Odisha, Chhattisgarh)"
    why: "Tests Pillar 1 — whether the carpenter-loyalty moat replicates outside Gujarat within the 3-year window."
    threshold: null
  - what: "VAM price/kg and gross margin (Q1-Q2 FY27)"
    why: "Defensive monitorable (not a pillar) — VAM is 90% of RM cost, 100% imported; a May 2026 60-70% price hike tests near-term gross-margin resilience above 65%."
    threshold: 65
  - what: "Brownfield 3,500 TPM go-live (target Q2 FY27)"
    why: "Enabler for Pillar 2 — capacity lift underpins the volume-growth test; a delayed ramp would invalidate the FY27 volume read."
    threshold: null

