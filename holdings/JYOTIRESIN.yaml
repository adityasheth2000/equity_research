management_promises:
  - said: "20% growth (reiterated across Q1, Q2, Q3 FY26 concalls)"
    when: 2025-06-01
    source: concall
    status: missed
    note: "FY26 revenue grew only ~10.8% YoY (8% volume); PAT fell 5.3%. Management acknowledged the miss in Q3 FY26 call, promised \"better planning,\" then declined to give specific FY27 numbers citing \"geopolitical issues.\""
  - said: "Debtor days to come back to 120 days within 2 quarters"
    when: 2025-09-01
    source: concall
    status: pending
    note: "Debtor days instead rose to 185 in FY26 from 161 in FY25; attributed to new-state expansion (UP, West Bengal, Karnataka)."
  - said: "NSE listing is \"in process\""
    when: 2025-06-01
    source: concall
    status: pending
    note: "Status has been \"in process\" for multiple quarters with no concrete progress as of FY26 verdict."
  - said: "Working on auditor upgrade (to Big 4/5)"
    when: 2025-06-01
    source: concall
    status: pending
    note: "Currently R Kabra & Associates (Ecovis Germany affiliated); management says \"on it\" but no timeline given."
  - said: "Brownfield expansion (2,000→3,500 TPM) live before Q2 FY27"
    when: 2025-06-01
    source: concall
    status: pending
    note: "80% complete as of FY26 verdict; go-live target Q2 FY27."
  - said: "Rs 500 Cr revenue in next 2-3 years; Rs 1,000 Cr long-term aspiration"
    when: 2025-06-01
    source: concall
    status: pending
    note: "Requires ~17% CAGR from Rs 315 Cr FY26 base; FY26 grew only 10.8%."

governance_flags:
  - "Small/solo auditor (R Kabra & Associates, Ecovis Germany affiliated) — multiple investors have publicly called for Big 4/5 upgrade."
  - "Hand-written corrections in concall transcripts (price rise clarification) undermine documentation quality."
  - "Confusing \"redemption\" accounting for carpenters' points liability (~Rs 95 Cr in other current liabilities) — same question recurs every quarter."
  - "NSE listing \"in process\" for multiple quarters with no concrete progress."
  - "Growth guidance repeatedly missed (20% promised, 8% delivered) creating investor trust deficit."
  - "Rs 166 Cr cash parked in low-yield FDs/MFs — drag on ROE/ROCE; no buyback despite investor calls for one."

latest_review:
  date: 2026-07-08
  new_since_last: >-
    First full verdict. Captures FY26 results (revenue Rs 315 Cr, PAT Rs 70 Cr
    down 5.3%), VAM price spike (Rs 75-80→160-180/kg) in Q1 FY27 with 60-70%
    pass-through from May 2026, brownfield 80% complete, Pankaj Tripathi brand
    push, and Odisha/Chhattisgarh state additions (May 2026).
  changed_my_view: >-
    Brand-spend ROI is the central doubt — ad spend nearly tripled while FY26
    revenue grew only ~11%, and growth was rescued by a single strong Q4.
    Combined with ballooning debtor days (185) and immediate VAM headwinds,
    this shifts the thesis from \"growth re-rating\" to \"wait for proof.\" The
    pillars are now two-sharp tests on volume conversion and working-capital
    reversion, plus the underlying new-state replication claim.
  next_check: "Q1FY27 results — volume growth, gross margin impact from VAM pass-through, and debtor-days trajectory."
  open_questions:
    - "Will VAM pass-through fully protect gross margins in Q1-Q2 FY27, or will there be a temporary margin air-pocket?"
    - "Can the Pankaj Tripathi brand campaign demonstrably lift FY27 volume growth above 15%?"
    - "Will debtor days actually revert toward 150 (or 120) by FY27, or keep climbing as new states onboard?"
    - "Will pre-FY26 new states (UP, Delhi, WB, Karnataka) demonstrably progress toward break-even within their 3-year window?"
    - "Will the auditor upgrade / NSE listing materialize, addressing the investor-trust deficit?"

history:
  - date: 2026-07-08
    note: "Initial verdict — WAIT AND WATCH; high-quality business but growth sputtering, margins compressing, FY27 is the inflection test."
