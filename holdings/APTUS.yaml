governance_flags:
  - Promoter stake declined from 62% (Jun 2023) to 23.87% (FY26) — large secondary selldown; being absorbed by FIIs/DIIs
  - Dual-entity structure (HFC AVHFIL + NBFC subsidiary AFIPL) used to route SME/LAP loans — adds complexity and 48% non-housing exposure
  - Top 3 states concentration of 91% (AP 44%, TN 28%) — single-state political/regulatory risk

latest_review:
  date: 2026-07-10
  new_since_last: >-
    Q4 FY26 NPA stabilization (GNPA 1.52%, 30+ DPD 6.21%, collection efficiency
    100.5%); CARE reaffirmed AA/Stable in Jul 2026; FY26 results with PAT ₹943
    Cr (+26%) and RoE 20.1%; Maharashtra/Odisha AUM at ₹143 Cr (+165% growth).
  changed_my_view: >-
    The Q4 FY26 asset quality stabilization is the most important data point — it
    suggests the NPA cycle may be peaking rather than deteriorating structurally,
    supporting the BUY thesis at PEG ~0.6.
  next_check: Q1 FY27 results (expected August 2026) — NPA confirmation and disbursement growth vs 22-24% guidance
  open_questions:
    - Has M. Anandan stopped selling promoter stake, or will the decline continue?
    - Will non-housing (LAP/SME) slippages remain contained as the book seasons?
    - Can CoB reach 8% in FY27 given the AA rating?

