thesis:
  summary: >-
    Affordable HFC focused on self-employed borrowers in South India Tier-2/3/4
    cities; ₹13,107 Cr AUM, 339 branches across 7 states, dual-entity structure
    (HFC + NBFC subsidiary AFIPL for SME/LAP, 48% non-housing book). Trading at
    15x P/E with 20.1% RoE (PEG ~0.6) after a 1-year -18% drawdown.
  bull:
    - Q4 FY26 GNPA fell 4 bps QoQ to 1.52%, 30+ DPD improved to 6.21%, collection efficiency 100.5% — earliest sign of asset quality cycle peaking
    - 26% AUM CAGR (FY21-FY26) with 29% PAT CAGR; 71% CRAR and 1.56x gearing mean 22-24% FY27 growth is fundable internally without dilution
    - AA rating (CARE + ICRA) being actively repriced; CoB fell 8.7% to 8.3% in FY26, lifting spread to 8.9%
  bear:
    - GNPA rose from 1.19% to 1.52% through FY26; non-housing (48% of book) is the slippage source — if Q4 stabilization reverses, the cycle is not over
    - Promoter stake down from 62% (Jun 2023) to 23.87% — continued selling would break the governance optics and cap re-rating
    - Top 3 states = 91% of AUM (AP 44%, TN 28%) — single-state political/regulatory shock would hit both asset quality and growth
  pillars:
    - claim: The asset quality cycle peaked in Q4 FY26 — GNPA and 30+ DPD will not make new highs
      falsifier: "Q1 FY27 (Aug 2026) GNPA rises above 1.56% AND 30+ DPD rises above 6.48% (Q3 FY26 high), reversing the Q4 improvement"
      status: intact
    - claim: FY27 AUM growth delivers within the 22-24% guidance band
      falsifier: "FY27 exit AUM below ₹16,000 Cr (i.e., growth < 22%) or two consecutive quarters of sub-15% YoY disbursement growth"
      status: intact
    - claim: RoE sustains at or above 18% through FY27 as spread holds and operating leverage absorbs branch ramp
      falsifier: "Any FY27 quarter annualized RoE below 18%, or FY27 spread compressing below 8.7% (CoB stays above 8.3% / yield drops below 17%)"
      status: intact

monitorables:
  - what: Q1 FY27 GNPA and 30+ DPD
    why: Pillar 1 — confirms or breaks the Q4 FY26 cycle-peak call
    threshold: 1.56
  - what: Non-housing (SME/LAP) portfolio slippage rate
    why: Pillar 1 — leading indicator; 48% of book and source of most FY26 slippages
    threshold: null
  - what: FY27 quarterly AUM growth (YoY) and exit AUM
    why: Pillar 2 — tests the 22-24% guidance credibility
    threshold: 22
  - what: FY27 quarterly RoE (annualized) and net interest spread
    why: Pillar 3 — profitability durability under branch ramp and CoB repricing
    threshold: 18

