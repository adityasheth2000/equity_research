thesis:
  summary: >
    World's #2 visa/consular outsourcing pure-play (only listed globally), serving 46+ governments across 70+ countries.
    Asset-light leased VACs, USD/EUR-denominated contracts with local collection, negative-WC model historically.
    Trades at deep P/E discount (14x vs peer median 34x) despite ROCE ~29%; thesis rests on Visa margin sustainability and renewal retention.
  bull:
    - Visa & Consular EBITDA margin jumped from 14.6% (FY22) to 40.1% (FY26) on self-managed model transition; management guides hold at ~40%
    - USD 1-2 Bn of contracts up for renewal over next 1-2 years; BLS wins ~90% of contracts it bids for renewal
    - Net cash of Rs. 1,434 Cr funds Rs. 2,000 Cr earmarked M&A without leverage
  bear:
    - Tender/renewal concentration — Spain global and India MEA up for renewal FY27-28; single loss materially impacts revenue
    - Digital segment EBITDA margin compressed from 14.3% (FY24) to 7.0% (FY26) despite 3x revenue growth — mix shift compressing blended margin
    - Goodwill at Rs. 1,213 Cr (32% of total assets) from 4 acquisitions in 24 months — impairment risk if any underperforms
  pillars:
    - claim: Visa & Consular EBITDA margin sustains at ~40% (the source of ~90% of EBITDA from ~61% of revenue)
      falsifier: "Any sequential quarter Visa & Consular EBITDA margin prints below 38% (within FY27)"
      status: intact
    - claim: BLS retains its major renewal contracts (Spain global, India MEA) at the historical ~90% win rate
      falsifier: "Loss of either Spain global or India MEA contract at renewal during FY27-28"
      status: intact

monitorables:
  - what: Visa & Consular EBITDA margin (quarterly)
    why: Pillar 1 falsifier — core earnings power
    threshold: 38
  - what: Spain global and India MEA renewal outcomes
    why: Pillar 2 falsifier — revenue continuity
    threshold: 0

