governance_flags:
  - "Promoter holding high at 70.39% (Mar 2026); free float only 29.6%; FII holding 6.14%"
  - "Family-run — Diwakar Aggarwal (Chairman), Shikhar Aggarwal (JMD), Nikhil Gupta (MD), Gaurav Aggarwal (Director)"
  - "MEA 2-yr debarment (Oct 2025) — later quashed by Delhi HC (Dec 2025); management did not see it coming"
  - "Goodwill at Rs. 1,213 Cr = 32% of total assets from 4 acquisitions in 24 months — impairment watch"
  - "Conservative guidance pattern (guide 20-25%, deliver 30%+) — may indicate deliberate under-promising"
  - "Working capital swung from -42 days (FY25) to +2 days (FY26) — acquisitions changing model character"

latest_review:
  date: 19 July 2026
  new_since_last: >
    FY26 results (Revenue Rs. 2,998 Cr, PAT Rs. 724 Cr, Visa margin 40.1%, Digital margin 7.0%);
    Atyati acquisition closed Jul 2026 (Rs. 157 Cr, adds 25,900 CSPs); CRISIL A+/Stable reaffirmed
    Apr 2026; MEA debarment quashed Dec 2025; new MEA China contract + Spain orders Jan-Mar 2026.
  changed_my_view: >
    Visa margin expansion to 40.1% (from 14.6% in FY22) is the single most impressive operational
    transformation; 1-year -38% stock price decline appears disconnected from fundamentals —
    likely low free float, geopolitical overhang, and digital-mix-margin fears.
  next_check: Q1 FY27 results and renewal pipeline win-rate (Spain global, India MEA)
  open_questions:
    - Will Digital margin stabilize at 7-8% or recover toward double-digits?
    - Will USD 1-2 Bn renewal pipeline convert at historical ~90% win rate?
    - Will working capital revert to negative territory or stay positive?

