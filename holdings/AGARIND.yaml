    note: "Management admitted max fleet capacity is only 5-6 lakh tons yet kept the doubling target."

governance_flags:
  - "5 consecutive quarters of overpromised volume guidance followed by misses"
  - "Pattern of shifting blame to external factors (floods, elections, geopolitics, monsoon) while keeping 3-year narrative unchanged"
  - "No concall in 11 months (last was Aug 2025) — unusual silence suggests nothing positive to share"
  - "Geopolitical disclaimers added to forecasts in Aug 2025 call — preparing investors for further misses"
  - "Earnings quality concern — other income (₹24 Cr standalone) is ~50% of PBT, masking weak core operations"

latest_review:
  date: 2026-07-08
  new_since_last: >-
    FY26 full-year results showing revenue -31% YoY, ROCE collapse to 8%, Q1 FY26
    volume -27%, and shipping EBIT collapse to 11.3% along with management's own
    admission that max fleet capacity is only 5-6 lakh tons against the FY28 doubling target.
  changed_my_view: >-
    The ₹500 Cr+ vessel capex has not expanded margins — it is a treadmill to stay
    competitive — and management credibility is destroyed after 5 quarters of guidance
    misses, making the bull case untenable. Two of three pillars already broken.
  next_check: Q2 FY27 results and the next concall for any guidance reset
  open_questions:
    - Is the H2 FY26 volume recovery seasonal or genuinely structural?
    - Will management finally reset guidance to realistic levels?
    - Can shipping EBIT margins recover above 15% or is vessel overcapacity structural?
    - Is AICL regaining or continuing to lose market share to bitumen imports?

