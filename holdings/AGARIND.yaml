thesis:
  summary: >-
    A commodity bitumen processor that rode the post-COVID infra cycle to 5x returns
    and is now in mean reversion. Owns 11 vessels (1,25,000 MT) and 7 plants / 7
    terminals, with deep PSU relationships (IOCL, BPCL, HPCL) — but revenue -31% YoY,
    ROCE collapsed 22% to 8%, and management credibility destroyed after 5 quarters of
    guidance misses. Held only while the structural cost advantage and book-value
    floor remain intact.
  bull:
    - Own vessel fleet is a structural cost moat versus competitors using third-party shipping.
    - Indian road / NHAI capex continues; bitumen demand grows 4-6% CAGR with rising import dependence favouring integrated players.
    - Stock trades at 1.10x consolidated book (₹461) — downside cushion if ROE stabilises.
  bear:
    - Q1 FY26 volumes -27% while industry imports flat/slightly up — clear market share loss.
    - ₹500 Cr+ vessel capex over FY22-FY25 has not lifted OPM above 8% — capex is a treadmill.
    - 5 consecutive guidance misses with shifting external blame; no concall in 11 months.
  pillars:
    - claim: "Own vessel fleet delivers a structural cost advantage visible in shipping EBIT margins above 18%."
      falsifier: "Shipping segment EBIT margin stays below 15% for 3 consecutive quarters (was 25-31%, now 11.3%) — moat gone, would sell."
      status: weakening
    - claim: "AICL retains market share in a growing bitumen market — volumes grow at or above industry import growth."
      falsifier: "AICL bitumen volumes decline >10% YoY while industry imports are flat/up for 2 consecutive quarters — structural share loss, would sell."
      status: broken
    - claim: "Management guidance is achievable and trustworthy within 10% of target."
      falsifier: "A 6th consecutive guidance miss by >10%, OR no concall held for 12+ months — credibility unrecoverable, would sell."
      status: broken

monitorables:
  - what: Shipping segment EBIT margin
    why: Pillar 1 — vessel cost moat must show up in shipping economics
    threshold: 15
  - what: AICL bitumen volume YoY vs industry import growth
    why: Pillar 2 — market share retention vs structural loss
    threshold: -10
  - what: Next concall + achievement of next volume guidance
    why: Pillar 3 — guidance credibility rebuild
    threshold: 10
  - what: Consolidated EBITDA margin
    why: Pillar 1/2 — must recover above 8% to justify capex and book-value floor
    threshold: 8
  - what: FII holding trend
    why: Continual FII selling signals low confidence; stabilisation needed
    threshold: 4.69

