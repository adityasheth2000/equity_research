thesis:
  summary: >
    BFIL is a precision forging/CNC machining supplier to global OEMs, transitioning from
    cyclical auto/agri crankshafts toward a defence/aerospace/railway platform. Defence is
    50% of the order book but only 13% of FY26 revenue, so the re-rating hinges on that gap
    closing at premium margins — but the thesis is gated by a working-capital cash furnace
    (OCF 10.6% of EBITDA, debtor days 140) and a CRISIL Stable→Negative→Withdrawn trajectory.
  bull:
    - Defence/Aerospace/Railway is 50% of order book vs 13% of FY26 revenue; convergence at premium margins transforms the P&L.
    - 5-year organic execution — Revenue 142→1,107 Cr (51% CAGR), PAT 8→259 Cr (102% CAGR) — with Hattargi operational and gross block at FY27 target.
    - Trades at 21x TTM vs peer median 28.9x; re-rating room to 25-30x if both pillars hold.
  bear:
    - Working capital is a cash furnace — OCF Rs. 32 Cr on Rs. 300 Cr EBITDA, debtor days 140, payable days halved to 32, CCC 182 days; FCF negative in 4 of last 5 years.
    - Credit-rating trajectory Stable→Negative→Withdrawn at company request; FII holding halved from 10.4% to 5.0%.
    - Guidance credibility gap — 40-45% FY26 growth guided, 19.9% delivered; shell line "under commercialisation" since Aug 2025 with near-zero revenue.
  pillars:
    - claim: Defence/Aerospace/Railway order book (50% mix) converts to revenue at premium margins over FY27-FY28.
      falsifier: Defence revenue share stays below 15% through H1FY27, or shell contribution remains near-zero past Dec 2026.
      status: intact
    - claim: The 140-day debtor blowout is temporary/geopolitical, not structural, and normalises within FY27.
      falsifier: Debtor days stay above 130 through Q2FY27, or FY27 OCF stays below Rs. 150 Cr.
      status: weakening

monitorables:
  - what: Defence/Aerospace/Railway revenue share (quarterly)
    why: Tests pillar 1 — the order-book-to-revenue conversion.
    threshold: 15
  - what: Debtor days and FY27 OCF
    why: Tests pillar 2 — whether the working-capital blowout is temporary or structural.
    threshold: 130

