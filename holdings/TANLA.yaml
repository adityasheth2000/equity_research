management_promises:
  - said: "20% EBITDA CAGR over the next 2 years"
    when: 2025-07-01
    source: AGM / Q1 FY26 concall
    status: missed
    note: FY26 EBITDA growth was +4.8% YoY (₹691 → ₹724 Cr) vs 20% aspiration. Management later clarified it was an "aspiration not guidance."
  - said: "₹800 Cr EBITDA committed to Board for FY26, maximum miss ₹50 Cr"
    when: 2025-10-01
    source: Q2 FY26 concall
    status: missed
    note: FY26 EBITDA came in at ₹724 Cr — missed even the ₹750 Cr floor by ₹26 Cr and the ₹800 Cr aspiration by ₹76 Cr.
  - said: "Gigantic platform launch within ~1 month"
    when: 2026-04-27
    source: Q4 FY26 concall
    status: pending
    note: No announcement as of analysis date Jul 19, 2026 — 12+ weeks overdue.
  - said: "ValueFirst UAE closure this quarter"
    when: 2026-01-01
    source: Q3 FY26 concall
    status: missed
    note: Still pending RBI approval as of Jul 2026 — delayed ~3 years from original 2022 announcement. Uday has repeatedly said "this quarter" and missed.
  - said: "₹1,000 Cr cumulative return to shareholders"
    when: 2020-01-01
    source: concall
    status: kept
    note: Over-delivered — cumulative ₹1,260 Cr returned FY21-FY26 via dividends + 4 buybacks in 5 years.
  - said: "Wisely Ai first international deployment"
    when: 2024-01-01
    source: concall
    status: kept
    note: Indosat partnership announced Aug 7, 2025; 100M subscribers protected; 2B+ scam/spam communications blocked in 6 months; Indosat attributed 10% ARPU growth to Wisely Ai.
  - said: "First ATP bank deals (3 banks)"
    when: 2024-01-01
    source: concall
    status: kept
    note: 3 Indian banks signed, including Bandhan Bank going live in Q4 FY26; first month billed. ~5-year subscription contracts at per-subscriber-per-month pricing.
  - said: "Karix acquisition will unlock WhatsApp leadership"
    when: 2019-01-01
    source: concall
    status: kept
    note: Karix is now Meta's "Partner of the Year 2025" and the largest WhatsApp BSP in India.
  - said: "ValueFirst acquisition will add ~5% CPaaS market share"
    when: 2023-01-01
    source: concall
    status: kept
    note: Tanla's market share moved from ~30% to ~35% post-ValueFirst.
  - said: "Digital Platforms to grow much faster / multiplying efforts"
    when: 2026-04-27
    source: Q4 FY26 concall
    status: missed
    note: FY26 Digital Platforms revenue growth was only +8.5% YoY (₹364 → ₹395 Cr), marginally above overall growth despite heavy Wisely Ai investment.
  - said: "Domestic MF participation will improve"
    when: 2026-01-01
    source: Q3 FY26 concall
    status: pending
    note: FII holding fell from 15.15% (Sep 2023) → 7.60% (Mar 2026); DII holding stayed sub-1%.
  - said: "ROCE ex-cash > 40%"
    when: 2020-01-01
    source: concall
    status: kept
    note: FY26 ROCE ex-cash 47%; FY25 41%; FY24 38%.
  - said: "Stable 25-27% gross margin band"
    when: 2025-04-01
    source: FY25 concall
    status: kept
    note: FY26 gross margin 26.6%, within the band, though Enterprise Communications gross margin slipped to 17.9% in Q1 FY26.

governance_flags:
  - Promoter holding rose from 44.17% (Sep 23) to 48.17% (Jun 26) — a 400 bps increase via creeping acquisition (open-market purchases + buyback non-participation); raises governance questions about creeping control without an open offer, though within Sebi norms.
  - FII holding nearly halved from 15.15% to 7.60% over 3 years — the most negative structural trend in shareholding; reflects foreign institutional fatigue with de-rating and growth slowdown.
  - DII holding sub-1% — virtually no domestic institutional ownership despite management's commitment to "increase coverage."
  - Shareholder count peaked at 3,03,507 (Mar 25) and declined 13% to 2,64,765 (Mar 26), suggesting retail investors giving up on the stock.
  - Management plays "aspiration vs guidance" semantics on EBITDA CAGR targets and "gigantic platform launch in ~1 month" promises, eroding credibility.
  - Repeated missing of "this quarter" commitments on ValueFirst UAE closure suggests over-committing or failure to communicate regulatory delays honestly.
  - CFO transition — Anubhav Batra took over as CFO in July 2025 (replacing Abhishek Jain); audit veteran Sunil Bhumralkar joined board Jun 2025 as independent director and Audit Committee Chair.

latest_review:
  date: 2026-07-19
  new_since_last: >
    First full analysis. Compiled from screener.in snapshot (Jul 19, 2026),
    5 investor presentations (May 2025 → May 2026), 5 earnings call transcripts
    (May 2025 → May 2026), and 5 CARE credit-rating reports (Feb 2020 → Apr 2026).
  changed_my_view: >
    Q4 FY26's +15% YoY revenue print and the Indosat deployment validate the
    inflection from the FY25 trough — the trough appears firmly behind the
    company. However, management's repeated over-promising on EBITDA CAGR
    (20% aspiration vs 4.8% delivered) and the 12+ week delay on the "gigantic
    platform" launch damage near-term credibility; FII exodus is a structural
    concern. Stock is cheap for a reason — favorable risk-reward but wait for
    visible confirmation of monitorables before adding aggressively.
  next_check: >
    Q1 FY27 results — watch for revenue growth sustaining >10%, EBITDA margin
    recovery toward 17-18%, FCF/PAT holding ≥80%, and any new Wisely Ai telco
    win beyond Indosat.
  open_questions:
    - Can Wisely Ai convert the visible telco pipeline into 2-3 more Indosat-scale deployments within 2 years?
    - Will margin compression reverse on operating leverage, or are talent/RSU/AI costs a new normal that eventually breaks the FCF pillar?
    - Will ValueFirst UAE ever close, and is the ~3 year delay regulatory or execution-driven?
    - Why are FIIs continuing to exit despite a debt-free, market-leading, FCF-positive business?

