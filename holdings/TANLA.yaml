thesis:
  summary: >
    India's largest CPaaS player (~30-35% market share), debt-free with ~₹1,000 Cr
    cash and 26% ROCE. Two engines: a pass-through Enterprise Communications
    aggregation business (~91% of revenue, ~20% gross margin) and a proprietary
    Digital Platforms SaaS business (~9% of revenue, ~98% gross margin) led by
    Wisely Ai, whose first international deployment (Indosat, 100M subscribers)
    is the proof point for global replication. Trading at 15x P/E / 6.2% FCF yield
    — cheap because management over-promises, FII holding has halved, and Digital
    Platforms growth is still single-digit despite heavy investment.
  bull:
    - Indosat deployment proves Wisely Ai replicates at 100M-subscriber telco scale; each new telco could add ₹100-200 Cr ARR at ~98% gross margin.
    - Q4 FY26 +15% YoY revenue confirms the FY25 trough is behind; OTT share rose 15% → 31% of revenue over two years, providing a structural mix tailwind.
    - Debt-free balance sheet with ₹1,000 Cr cash (14% of market cap), 94% FCF conversion, and ₹1,260 Cr cumulative capital returned FY21-FY26 underpin the margin of safety.
  bear:
    - Wisely Ai pipeline fails to convert beyond Indosat, leaving Digital Platforms stuck at single-digit growth despite heavy investment — the platform narrative stalls for another 2-3 years.
    - EBITDA margin keeps compressing (22% → 16.4% over 4 years) as talent, RSU, and AI costs rise faster than revenue, eventually squeezing FCF and the capital-return story.
    - FII exodus (15% → 7.6%) and promoter creep-buying (44% → 48%) continue without a catalyst; stock de-rates to 10-12x P/E and languishes.
  pillars:
    - claim: Wisely Ai is a replicable global SaaS platform, not a one-off Indosat deployment.
      falsifier: "No new telco Wisely Ai win beyond Indosat by end of FY28 (2 years from now)."
      status: intact
    - claim: Revenue growth has sustainably inflected above 10% YoY after the FY25 trough (Q4 FY26 +15%).
      falsifier: Quarterly YoY revenue growth falls below 5% for 2 consecutive quarters.
      status: intact
    - claim: FCF generation sustains ≥80% of PAT, funding continued capital return.
      falsifier: FCF/PAT falls below 80% for 2 consecutive fiscal years, or buybacks and dividends are paused without rationale.
      status: intact

monitorables:
  - what: New Wisely Ai telco wins beyond Indosat
    why: Pillar 1 — each Indosat-scale deployment (100M subs) could add ₹100-200 Cr ARR at ~98% gross margin.
    threshold: 1
  - what: Quarterly YoY revenue growth
    why: Pillar 2 — confirming the FY25 trough is behind and OTT/Wisely Ai engines are kicking in.
    threshold: 10
  - what: FCF / PAT ratio
    why: Pillar 3 — cash conversion underpinning the capital-return margin of safety.
    threshold: 80
  - what: EBITDA margin trajectory
    why: Pillar 3 (upstream) — FY26 at 16.4%; sustained sub-16% would compress FCF and break the capital-return pillar.
    threshold: 16
  - what: Digital Platforms revenue growth
    why: Pillar 1 (upstream) — FY26 only +8.5%; if platform revenue stays single-digit for another 2 years, Wisely Ai replication claim is in doubt.
    threshold: 20

