  - said: "Yield reduction to align with peers (~17.5-18%) in 4-6 quarters"
    when: 2025-08
    source: Q1 FY26 call
    status: kept
    note: Q4 FY26 yield 17.3% — slightly below guided range but largely on track in 4 quarters.
  - said: "MCLR cuts will benefit cost of borrowing"
    when: 2025-08
    source: Q1 FY26 call
    status: kept
    note: CoB fell from 9.4% (Q4 FY25) to 8.6% (Q4 FY26), ~80 bps reduction.
  - said: "Asirvad to turn green by Q4 FY26"
