governance_flags:
  - "Disclosure inconsistencies on Q4 FY26 call — auction number Nandakumar said Rs 29 Cr vs Bindu Rs 15 Cr (unresolved); Q3 FY26 impairment restated Rs 217 Cr to Rs 249 Cr; Q3 FY26 interest income restated by ~Rs 100 Cr ('some regrouping')."
  - "Forward guidance repeatedly walked back — ROE 18% (May 2025) -> 13-16% -> 'over 15% for FY28'."
  - CEO transition mishandled — Deepak Reddy's health issue not communicated until Q4 FY26 call.
  - Asirvad acquisition (2015) a recurring value-destroyer — losses in last 4 quarters exceed accumulated profit of previous 38 quarters.
  - Diversification track record poor — VEF, MSME, MFI all under stress simultaneously.
  - Open leadership positions — Head of Internal Audit, Head of Risk unfilled.
  - Nandakumar (75+ years) continues as MD/Chairman with no CEO successor active.

latest_review:
  date: 2026-07-19
  new_since_last: >-
    Q4 FY26 print (PAT +Rs 405 Cr, ROE 12.3% annualized) cleanest quarter in 4
    quarters; Asirvad turned green (+Rs 13 Cr) but with Rs 96 Cr one-off; Bain
    Capital first tranche Rs 2,740 Cr received (March 2026); RBI removed branch
    prior-approval requirement; new gold lending norms (effective April 1, 2026)
    enable income-generating loans with no LTV cap for quality borrowers.
  changed_my_view: >-
    The diversification thesis of FY22-FY24 has been effectively abandoned — gold
    share rose from 59% to 80% of AUM in one year via Asirvad shrinkage, not gold
    growth. Q4 FY26 ROE of 12.3% (annualized) may mark the inflection, but
    earnings quality is questionable due to one-off benefits. ROE guidance has
    been walked back twice.
  next_check: >-
    Q1-Q2 FY27 results — test whether Asirvad delivers sustainable PAT without
    one-off MTM/ECL gains, whether gold yield holds at/above 17%, and whether
    consolidated ROE steps up from 7%.
  open_questions:
    - Can Asirvad deliver PAT in Q1-Q2 FY27 without one-off MTM/ECL write-backs?
    - Will gold yield hold at or above 17% under intensifying bank competition?
    - Will consolidated ROE progress toward 13-16% by FY28, or be walked back again?

