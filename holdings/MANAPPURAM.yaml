thesis:
  summary: >-
    India's #2 gold loan NBFC (80% of AUM is gold) with a digital-first model
    (OGL = 92% of gold book), conservative LTV (57%), and Bain Capital as a
    joint promoter (~9.9% with Rs 1,644 Cr warrants pending). The thesis is a
    turnaround: strong gold fundamentals offset by persistent non-gold drag
    (Asirvad MFI, VEF, MSME) and a CEO vacuum. Own only if Asirvad sustains
    profit, gold yield holds, and consolidated ROE expands to mid-teens by FY28.
  bull:
    - Gold franchise genuinely strong — AUM +98% YoY in FY26, OGL 92% is a digital moat, cost of borrowing fell 80 bps to 8.6%.
    - Asirvad turned green in Q4 FY26 (+Rs 13 Cr) with new-book collection efficiency 99.4%+; old book running off.
    - Q4 FY26 consolidated ROE annualized at 12.3% — cleanest quarter in 4 quarters, possible inflection.
  bear:
    - Consolidated ROE just 7.0% FY26 vs Muthoot's 20%; guidance already walked back twice (18% -> 13-16% -> "over 15% for FY28").
    - Gold yield compressed 500 bps in 4 quarters (22.3% -> 17.3%); bank gold-loan market share rose to 55%.
    - Asirvad Q4 FY26 profit relied on Rs 96 Cr one-off MTM/ECL write-back; FY26 loss of Rs 579 Cr exceeded accumulated profit of prior 38 quarters.
    - CEO Deepak Reddy on indefinite medical leave; Nandakumar 75+; disclosure inconsistencies on Q4 FY26 call.
  pillars:
    - claim: Asirvad MFI has bottomed and delivers sustainable PAT from FY27 without one-off MTM/ECL write-backs.
      falsifier: Asirvad posts a loss in any of Q1-Q3 FY27, or quarterly PAT is positive only because of MTM/ECL write-backs.
      status: intact
    - claim: "Gold loan yield holds at or above 17% (management floor: 17.5-18%, will not go down)"
      falsifier: Standalone gold yield prints below 17.0% in any quarter of FY27 due to bank competition or RBI LTV-inclusive-of-interest caps.
      status: intact
    - claim: Consolidated ROE expands to 13-16% by FY28, the level required to justify the current P/B and re-rate vs Muthoot.
      falsifier: FY27 consolidated ROE stays below 10% or management walks back the "over 15% for FY28" target again.
      status: weakening

monitorables:
  - what: Asirvad quarterly PAT excluding one-off MTM/ECL write-backs
    why: Pillar 1 falsifier — sustainable green PAT without one-offs is the true test of the bottom.
    threshold: 0
  - what: Asirvad new-book share of MFI portfolio (Q4 FY26 = 59%, target 75%)
    why: Pillar 1 — old-book run-off and new-book dominance determine durability of the turnaround.
    threshold: 75
  - what: Standalone gold loan yield (Q4 FY26 = 17.3%)
    why: Pillar 2 falsifier — direct driver of NIM; break below 17% breaks the re-rating math.
    threshold: 17.0
  - what: Consolidated ROE (FY26 = 7.0%, target 13-16% by FY28)
    why: Pillar 3 falsifier — re-rating depends on ROE expansion; stagnation compresses P/B.
    threshold: 13.0
  - what: Consolidated gearing (Mar 26 = 3.60x; CARE/CRISIL downgrade trigger at 5x sustained)
    why: Pillar 3 — a downgrade would raise cost of funds and break the ROE trajectory.
    threshold: 5.0

