thesis:
  summary: >-
    B2B 22KT CZ studded cast gold jewellery maker supplying organized retailers
    (Kalyan, Joyalukkas, Lalithaa, Alukkas). FY26 revenue ₹2,019 Cr (+82.5%),
    PAT ₹140 Cr (+159%), but ~₹40-50 Cr of PAT was inventory gains from IPO
    proceeds deployed at low gold prices, so normalized core PAT margin is ~4%
    (real TTM P/E ~16-18x, not the reported 11.4x). The bet is execution on a 3x
    capacity ramp to 7,900 kg by FY29 across two new facilities (Marol 4,000 kg,
    Jaipur 1,200 kg) while the mix shifts toward lower-margin plain gold.
  bull:
    - Marol (4,000 kg) operational from June 2026; Andheri (2,700 kg) already at 90% utilization proves the model.
    - Monte Carlo base case FY29 PAT ₹454 Cr at 3.5x forward P/E; 92.6% probability FY29 P/E < 5x, 0% > 10x.
    - Volume CAGR ~45% (1,748 kg to ~5,700 kg over 3 years) alone justifies a richer multiple if execution delivers.
  bear:
    - Margin compression as mix shifts from high-margin CZ bridal (~20% premium) to low-margin machine-made plain gold (~6% premium) — could break the cheapness argument even if volumes ramp.
    - Execution risk on 3x ramp across 2 new facilities plus unproven new product lines (plain gold, Mangalsutra, Turkish).
    - Gold price explains 71% of PAT variance; related-party overlap with Utsav Jewellery, no dividend, Screener-flagged interest capitalization.
  pillars:
    - claim: "Marol (4,000 kg flagship) reaches commercial production at ~100 kg/month (~80% utilization) by Q2 FY27."
      falsifier: "Marol output below ~50 kg/month by end of FY27, or utilization materially below 80% — ramp has stalled."
      status: intact
    - claim: "Jaipur (1,200 kg) is commissioned and producing by Q3 FY27 (Dec 2026)."
      falsifier: "Jaipur commissioning delayed beyond Dec 2026 with no production evidence — third facility not real."
      status: intact
    - claim: "Normalized core PAT margin holds at or above ~3.5% as volumes scale and mix shifts through FY27-FY28."
      falsifier: "Reported PAT margin falls below ~3% on a normalized (inventory-gain-stripped) basis over two consecutive halves — cheapness thesis is gone."
      status: intact

monitorables:
  - what: Marol monthly production volume (kg)
    why: Pillar 1 falsifier — proves the 4,000 kg flagship is ramping as modelled.
    threshold: 100
  - what: Jaipur facility commissioning and first production
    why: Pillar 2 falsifier — unlocks the FY29 capacity math.
    threshold: null
  - what: Normalized core PAT margin (inventory-gain-stripped, percent)
    why: Pillar 3 falsifier — tests whether mix-shift margin compression breaks the cheapness argument.
    threshold: 3.0
  - what: Gold price (₹/10g)
    why: Dominant swing factor (71% of PAT variance) contextualizing Pillar 3; not itself a pillar — bear case ₹1.2L still leaves ₹335 Cr PAT at 4.8x P/E.
    threshold: 120000

