governance_flags:
  - Promoters run Utsav Jewellery, a separate listed entity — related-party overlap.
  - No dividend declared despite repeated profits.
  - Screener flags potential interest capitalization.
  - "FY26 PAT inflated by ~₹40-50 Cr of inventory gains from IPO proceeds deployed at low gold prices during a rally — non-recurring."

latest_review:
  date: 2026-07-01
  new_since_last: >-
    Monte Carlo simulation (N=10,000, GBM μ=7%, σ=16%) quantifying FY27-FY29
    PAT distribution; identification of ~₹40-50 Cr inventory-gain PAT inflation
    in FY26; capacity roadmap table (Andheri/Marol/Jaipur) with utilization
    assumptions; sensitivity decomposition (gold β=+124.0, volume β=+47.3, R²=71%).
  changed_my_view: >-
    Reported FY26 PAT ₹140 Cr overstates sustainable earnings — normalized core
    margin is ~4%, so real TTM P/E is ~16-18x rather than the reported 11.4x.
    The thesis is execution on capacity and margin hold, not cheap valuation.
  next_check: "Q2 FY27 — Marol producing ~100 kg/month and Jaipur operational; normalized margin still ≥3.5%."
  open_questions:
    - Will GML hedging actually reduce or amplify earnings volatility once adopted?
    - Can new product-line customers be onboarded fast enough to absorb 5,200 kg of new capacity without crushing blended margin?
    - Is the inventory-gain tailwind fully behind us, or does IPO-proceed gold exposure still distort reported PAT?

history:
  - date: 2026-07-01
    note: First Monte Carlo verdict; thesis restructured to 3 falsifiable pillars (Marol ramp, Jaipur commissioning, core margin hold).
