ticker: URBANENVIRO
company: Urban Enviro Waste Management Ltd
list: holdings
sector: Municipal Solid Waste Management
first_analysed: 8-July-2026
last_analysed: 8-July-2026
last_doc_seen: 8-July-2026

thesis:
  summary: "MSW services microcap (NSE SME, listed 2023) serving municipalities across 5 states with 18 projects and a 529-vehicle fleet. Revenue has compounded 63% over 5 years and the stock is optically cheap at 7.3x P/E, but earnings quality is weak: negative FCF in 5 of 7 years, CFO/OP at 38%, and debtor days at 130. The discount is justified by cash-flow risk; ownership depends on collectibility and cash conversion turning, not on growth alone."
  bull:
    - "Revenue still compounding 29% in FY26 on a larger base; sticky multi-year municipal contracts underpin the run-rate."
    - "Stock at 7.3x P/E / 4.3x EV/EBITDA vs peer median 25x / 13.9x leaves re-rating room if cash quality improves."
    - "Promoters hold 51.19% with zero pledge and have delivered on every growth promise to date."
  bear:
    - "A 10-15% provision on the ₹65-70 Cr receivable book would wipe out FY26 PAT of ₹15 Cr entirely."
    - "CFO/OP stuck at 38-53% for 4 years means growth must be debt/equity-funded, not self-financed."
    - "Family-dominated board, 26% free float, no dividend, near-zero institutional ownership — exit and governance risk on any disappointment."
  pillars:
    - claim: "Receivables are real and collectible — PAT is not a fiction of aggressive recognition."
      falsifier: "Any write-off/provision exceeding 10% of receivables, or a disputed-bill disclosure, or debtor days crossing 150 — observable in FY27 annual report / auditor notes within 12 months."
      status: weakening
    - claim: "Cash conversion (CFO/PAT) will rise above 60%, enabling self-funded growth and positive FCF."
      falsifier: "FY27 CFO/PAT remains below 60% while debtor days fail to fall below 100 — observable in FY27 cash flow statement within 12-15 months."
      status: weakening
    - claim: "Revenue growth stays at or above 20%, large enough to outrun the SME liquidity discount."
      falsifier: "Two consecutive halves of revenue growth below 15%, or loss of the Chhattisgarh cluster contract — observable in H1/H2 FY27 results within 12 months."
      status: intact

monitorables:
  - what: "Receivable write-offs / provisions as % of receivables"
    why: "Pillar 1 (collectibility) — if the book is impaired, PAT is fictional."
    threshold: 10
  - what: "Debtor days"
    why: "Pillar 1 and Pillar 2 — rising days signal both collectibility and cash-conversion failure."
    threshold: 150
  - what: "CFO/PAT ratio"
    why: "Pillar 2 — must cross 60% for the re-rating thesis to hold."
    threshold: 60
  - what: "Half-yearly revenue growth (H1/H2 FY27)"
    why: "Pillar 3 — two sub-15% halves break the growth pillar."
    threshold: 15
  - what: "Chhattisgarh cluster contract status"
    why: "Pillar 3 — loss of the 42%-of-revenue cluster would break growth and concentration pillar."
    threshold: 1

