management_promises:
  - said: "Expand footprint in existing states (Maharashtra, Gujarat, MP, Rajasthan, J&K)"
    when: Sep-2024
    source: ppt
    status: kept
    note: "Revenue grew across states; Chhattisgarh emerged as #1 state (42% of FY24 revenue), geographic mix shifted."
  - said: "Enter new Tier-2/3 cities"
    when: Sep-2024
    source: ppt
    status: kept
    note: "Project count grew to 18 ongoing projects across 5 states."
  - said: "Invest in advanced vehicles, equipment, technology"
    when: Sep-2024
    source: ppt
    status: kept
    note: "Capex consistently ₹10-12 Cr/year into vehicle fleet; fleet at 529 vehicles; CWIP of ₹7 Cr in FY26."
  - said: "Focus on recycling and waste-to-resource (move up the value chain)"
    when: Sep-2024
    source: ppt
    status: pending
    note: "No evidence yet of meaningful move into higher-margin processing/recycling; Door-to-Door Collection (57% of FY24 revenue) remains the most labor-intensive, lowest-margin segment."

governance_flags:
  - "Family-dominated board (Kamlesh Sharma CMD, Suresh Sharma WTD, Vikas Sharma ED, Sheela Sharma NED) with limited institutional oversight."
  - "Near-zero FII/DII ownership and SME listing with only 26% free float."
  - "No dividend despite repeated profits; no return of capital to minority shareholders."
  - "Promoters hold 51.19% with zero pledge (positive skin in the game)."
  - "IPO oversubscribed 255x indicating initial market confidence."

latest_review:
  date: 8-July-2026
  new_since_last: "First analysis; established baseline financials, half-yearly seasonality pattern, and valuation framework across FY20-FY26."
  changed_my_view: "H2 consistently underperforms H1 (PAT drops 33-62% H2 vs H1) — pronounced seasonality not well-explained, possibly tied to contract billing cycles or expense recognition. Cash conversion has worsened for 4 straight years, not stabilized."
  next_check: "Q1 FY27 results — debtor days trajectory, CFO/PAT, and Chhattisgarh contract status."
  open_questions:
    - "Is the ₹65-70 Cr receivable book genuinely collectible, or do disputed bills / weak municipal counterparties lurk inside?"
    - "Did one large Chhattisgarh contract drive 42% of FY24 revenue, leaving concentration risk intact?"
    - "Why does H2 consistently underperform H1 — contract billing cycles or expense recognition timing?"
    - "Will the company ever move up the value chain into higher-margin processing/recycling, or remain a low-margin D2D collector?"

history:
  - date: 8-July-2026
    note: "Initial verdict — high-growth microcap, optically cheap at 7.3x P/E, but poor cash conversion and 130 debtor days justify the discount; fairly valued, monitor for improvement."
