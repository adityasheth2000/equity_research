thesis:
  summary: >
    Hyderabad-based EPC and O&M services provider scaling from Rs 224 Cr (FY19) to
    Rs 2,843 Cr (FY26) across Renewable Energy (79%), Telecom (14%), Railways, and BESS.
    Asset-light EPC model supplemented by selective IPP/BOO projects for annuity revenue;
    8 subsidiaries span the value chain. At 16.7x P/E with 38.7% ROCE, trades at peer
    median despite 2.3x median ROCE; -39% correction from Rs 503 highs partly prices in
    working capital and execution concerns. SME listing (BSE SME: 543971) limits
    institutional participation (FII 0.58%, DII 0.14%); mainboard migration planned Q3 FY27.
  bull:
    - "Rs 7,147 Cr order book (2.5x FY26 revenue) diversified across solar, BESS, telecom, railways provides conversion runway."
    - "FY26 CFO swung to +Rs 125 Cr after FY25's -Rs 158 Cr drain; Canara Bank Rs 507 Cr project finance sanctions BESS BOO, signalling lender comfort."
    - "850 MWh BESS BOO secured against India's <1 GWh installed base vs 132 GWh 2032 target — first-mover optionality."
  bear:
    - "CCC at 138 days (FY26 screener) vs management's 90-day target; Rs 1,328 Cr locked in receivables + inventory (65% of assets) — cash can swing negative fast."
    - "FY26 revenue Rs 2,843 Cr lagged implied OB burn rate of Rs 3,500-4,800 Cr — project delays already visible."
    - "100% Chinese cell dependency (50% of battery cost); BOO model locks in technology for 12-14 years against rapidly evolving chemistries."
  pillars:
    - claim: "Rs 7,147 Cr order book converts to Rs 3,500-4,800 Cr annual revenue run-rate by FY27."
      falsifier: "FY27 revenue falls below Rs 3,500 Cr due to project delays."
      status: weakening
    - claim: "Working capital cycle sustains improvement — CFO stays positive and CCC trends toward 90 days."
      falsifier: "CCC reverts above 138 days or CFO turns negative in any fiscal year."
      status: intact
    - claim: "BESS BOO executes — TNGECL and APTRANSCO reach COD, unlocking 12-25 year annuity revenue."
      falsifier: "TNGECL COD missed beyond 31 Dec 2026 or APTRANSCO COD slips beyond mid-2027."
      status: intact

