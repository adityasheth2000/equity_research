  - "Ind AS adoption only from FY25 creates comparability friction with historical financials."
  - "SME listing limits institutional participation (FII 0.58%, DII 0.14%) and analyst coverage despite peer-comparable fundamentals."

latest_review:
  date: 12 July 2026
  new_since_last: >
    First full analysis. FY26 results show revenue at Rs 2,843 Cr (81% YoY), EBITDA margin
    expansion to 11.5%, CFO swinging positive at +Rs 125 Cr after FY25's -Rs 158 Cr drain,
    and order book closing at Rs 7,147 Cr (below Oct 2025 guidance of Rs 8,500-9,000 Cr).
    BESS BOO now at 850 MWh under construction with Canara Bank Rs 507 Cr project finance
    sanctioned for TNGECL. Mainboard migration planned Q3 FY27. Defence (BEL Rs 4 Cr first
    order) and Data Centres (Microsoft O&M, Bryanston MoU) emerging with Q3 FY27 revenue
    recognition target.
  changed_my_view: >
    The BESS BOO vertical is the genuine differentiator — 850 MWh secured against India's
    <1 GWh installed base vs a 132 GWh 2032 target — and Canara Bank's Rs 507 Cr project
    finance sanction signals lender comfort with the BOO model. If executed, this shifts
    Bondada from a pure EPC compounder toward a hybrid EPC+utility with 12-25 year annuities.
  next_check: "TNGECL BESS COD by 31 Dec 2026 and Q3 FY27 mainboard migration announcement."
  open_questions:
    - "Will CCC sustain below 138 days and trend toward management's 90-day target?"
    - "Can FY27 revenue reach the implied OB burn rate of Rs 3,500-4,800 Cr, or will project delays persist?"
    - "Will the Rs 2,600 Cr L1 pipeline that didn't convert in FY26 finally book in FY27?"
    - "How rapidly will BESS BOO IRRs compress from 16-17% toward 13-14% as competition intensifies?"

