thesis:
  summary: >-
    Vertically integrated solar pump maker with ~70-72% share of PM KUSUM agri
    pumps and 5-yr revenue CAGR 54.7%, now pivoting from a single government
    scheme (PM KUSUM + Magel Tyala = 77.8% of FY26 9M revenue, Maharashtra 58%)
    into rooftop/utility/C&I solar. Post-IPO balance sheet is near debt-free
    (Net D/E 0.08x). The thesis is forward-looking: it is no longer about
    growth alone but about whether PM KUSUM 2.0 lands on time and whether
    diversification actually de-risks the revenue base before margin
    compression and receivable elongation (CCC 172 days) compound.
  bull:
    - PM KUSUM 2.0 expected to start execution revenue from Nov 2026 (Q3 FY27); ~70-72% installed agri-solar pump share gives Oswal pole position
    - Diversification pipeline of ~300 MW across rooftop/utility/C&I; management targets ~₹1,000 Cr in FY27 from new verticals
    - Backward integration (pumps, motors, modules, structures, BoS) underpins cost moat; FY26 EBITDA still 24.9% despite competitive tendering
  bear:
    - Government revenue 77.8% (FY26 9M) and Maharashtra 58% — extreme single-scheme, single-state dependence; any policy slip is existential
    - FY26 EBITDA margin compressed 446 bps to 24.9%; FY27 guidance lowered to 22-23% — competitive tender pricing is eroding the moat
    - FY26 OCF negative (₹771 Mn) with CCC at 172 days; receivables "fully secure" claim is unverified
  pillars:
    - claim: "PM KUSUM 2.0 reaches the LOI stage by Sept 2026 and begins execution revenue by Nov 2026 (Q3 FY27)"
      falsifier: "No LOIs issued by Sept 2026, or no execution revenue recognized by Q4 FY27 (Mar 2027)"
      status: intact
    - claim: "Diversified (rooftop/utility/C&I) solar revenue reaches at least ₹500 Cr in FY27, starting to de-risk the single-scheme base"
      falsifier: "FY27 diversified revenue below ₹300 Cr, or delivered at EBITDA margin below 15% (value-destructive)"
      status: intact
    - claim: "FY27 operating EBITDA margin holds at or above 22% despite competitive tender pricing, confirming the backward-integration moat still protects profitability"
      falsifier: "FY27 EBITDA margin falls below 20%, signalling the cost moat has been broken by competition"
      status: weakening

monitorables:
  - what: PM KUSUM 2.0 announcement, tendering and LOI timeline
    why: Pillar 1 — execution revenue from Nov 2026 is the single largest near-term catalyst
    threshold: 2026-09-30
  - what: FY27 diversified (rooftop/utility/C&I) solar revenue
    why: Pillar 2 — validates de-risking from PM KUSUM + Magel Tyala single-scheme dependence
    threshold: 500
  - what: FY27 Operating EBITDA margin
    why: Pillar 3 — tests whether backward-integration moat still protects profitability under competitive tendering
    threshold: 22

