governance_flags:
  - "Recent IPO (20 June 2025) — limited public market track record; only one year of listed financials"
  - "Promoter & Promoter Group holding 75.7% — high concentration; FIIs just 0.8%"
  - "Government revenue 77.8% (FY26 9M) — extreme policy/scheme dependence; business transformed from institutional (76% FY23) to government-led"
  - "Maharashtra 58% geographic concentration via Magel Tyala scheme — single-state political and counterparty risk"
  - "Receivables 'fully secure' claim by management is unverified; CCC elongated to 172 days with state nodal agency payment delays"
  - "Negative operating cash flow in FY26 (₹771 Mn) despite ₹3,763 Mn PAT — cash quality of earnings concern"

latest_review:
  date: 2026-07-05
  new_since_last: >-
    Initial analysis. Q4 FY26 results — revenue ₹20,644 Mn (+44.3%), PAT ₹3,763
    Mn (+34.1%), but Op. EBITDA margin compressed 446 bps to 24.9%. Balance
    sheet cleaned post-IPO (Net D/E 0.08x, ₹3,110 Mn debt repaid). Receivables
    elongated to 172 days CCC; FY26 OCF negative ₹771 Mn. FY27 guidance
    moderated to 20-25% growth and 22-23% EBITDA margin. PM KUSUM 2.0 timeline
    (Nov 2026 revenue start) and ~₹1,000 Cr diversification target are the key
    forward-looking anchors.
  changed_my_view: >-
    Margin compression (FY25→FY26 EBITDA 29.4%→24.9%) and receivables
    elongation reveal the fragility of the government-scheme-dependent model.
    The thesis is no longer pure growth — it now hinges on (a) PM KUSUM 2.0
    timing and (b) whether diversification can de-risk the revenue base
    without further margin dilution.
  next_check: PM KUSUM 2.0 announcement (expected June 2026) and LOIs by Sept 2026; Q1 FY27 results for margin/growth trajectory vs guidance
  open_questions:
    - Will PM KUSUM 2.0 rollout on schedule (announcement June, LOIs by Sept 2026)?
    - Can diversification deliver ≥₹500 Cr in FY27 without materially dilutive margins?
    - Will FY27 EBITDA margin hold at or above 22% under competitive tender pricing?
    - Will Maharashtra/Magel Tyala receivables normalize, or is 150-160 days the structural norm?

