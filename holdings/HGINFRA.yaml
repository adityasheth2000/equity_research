thesis:
  summary: >-
    Mid-cap EPC operator with a 20%+ ROE track record, now at 12.4x P/E on
    depressed FY26 earnings (PAT -35% YoY), hit by a CBI/ACB investigation
    (CMD named in FIR, Jan 2026), working-capital stress, and rising leverage.
    A Rs 1.57 Lakh Cr diversified order book (3.0x revenue) and a pending
    Rs 1,149 Cr HAM monetization offer asymmetric recovery upside if the CBI
    matter resolves and cash flows normalize.
  bull:
    - Cheapest in peer set at 12.4x P/E vs median 17.9x, pricing in significant pessimism on depressed earnings.
    - Rs 1,149 Cr HAM monetization with Neo Infra expected in FY27 releases equity and cuts project debt.
    - Rs 1.57 Lakh Cr order book (3.0x FY26 revenue) diversified across roads, railways, and energy gives strong revenue visibility.
  bear:
    - CBI/ACB FIR (Jan 2026) names the CMD; a chargesheet or NHAI/MoRTH debarment would be catastrophic.
    - FY26 EBITDA margin compressed to 12.9% standalone (Q4 at 9.4%); ROE halved from 21% (10Y) to 10% (TTM).
    - Persistently negative operating cash flows (FY24 -Rs 311 Cr, FY25 -Rs 878 Cr) and gearing up from 0.32x to 0.58x.
  pillars:
    - claim: The CBI/ACB investigation resolves without a chargesheet against the CMD or any contract debarment.
      falsifier: Chargesheet filed against CMD or NHAI/MoRTH contract debarment announced by FY27 end.
      status: intact
    - claim: The Rs 1,149 Cr HAM monetization with Neo Infra closes in FY27 and is applied to project debt reduction.
      falsifier: Deal delayed past FY27, cancelled, or proceeds diverted to operating obligations; consolidated debt fails to fall below Rs 4,092 Cr (FY25 level).
      status: intact
    - claim: Standalone EBITDA margin recovers above 12.9% (FY26 trough) as legacy low-margin orders burn off and new orders flow through.
      falsifier: Standalone EBITDA margin stays at or below 12.9% for two consecutive halves through FY27.
      status: weakening

monitorables:
  - what: CBI/ACB investigation outcome
    why: Pillar 1 — adverse development is catastrophic, clean closure removes the valuation discount.
    threshold: 0
  - what: HAM monetization closure with Neo Infra (Rs Cr received)
    why: Pillar 2 — deal must close and proceeds must reduce consolidated debt.
    threshold: 1149
  - what: Consolidated debt (Rs Cr)
    why: Pillar 2 — debt must fall below the Rs 4,092 Cr FY25 base to confirm monetization is deleveraging, not refinancing.
    threshold: 4092
  - what: Standalone EBITDA margin (percent)
    why: Pillar 3 — Q4 FY26 at 9.4% is the lowest in recent history; determines trough vs new normal.
    threshold: 12.9
  - what: TOL/TNW ratio
    why: Pillar 2 — rating downside trigger if it sustains above 1.0x.
    threshold: 1.0
  - what: BESS / solar / transmission execution progress
    why: Nice-to-have diversification — not a pillar, but cost overruns or delays on the 735 MW BESS portfolio (currently 0-8% complete) would compound the bear case.
    threshold: null

