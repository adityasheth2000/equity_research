governance_flags:
  - CBI/ACB search operations (Jan 2026) at 3 company locations; CMD Harendra Singh named in FIR; interim court protection granted.
  - Promoter holding declined from 74.5% (Sep 2024) to 71.8%.
  - FII holding halved from 2.9% to 1.4%; DII holding declined from 12.0% to 10.7% — institutional exodus.
  - Working capital intensity rising — gross current asset days up from 171 (FY24) to 218 (FY25).
  - CARE facility reduced from Rs 200 Cr to Rs 140 Cr in Apr 2026 update.

latest_review:
  date: 2026-07-11
  new_since_last: >-
    FY26 results confirmed sharp earnings reversal (PAT -32.6% standalone,
    -34.7% consolidated); CBI/ACB investigation emerged Jan 2026; HAM monetization
    with Neo Infra announced; post-FY26 order wins of Rs 55,914 Mn including
    Welspun Pune-Shirur.
  changed_my_view: >-
    The earnings compression is real and not transient — interest costs nearly
    doubled on NCD issuance and working capital debt, and margins hit a
    multi-year low. The thesis now hinges critically on CBI resolution and HAM
    monetization rather than organic execution alone.
  next_check: HAM monetization closure and FY27 Q2 results for margin/working capital trajectory.
  open_questions:
    - Will the CBI investigation result in chargesheet or contract debarment?
    - Will HAM monetization proceeds actually reduce consolidated debt below the Rs 4,092 Cr FY25 base?
    - Is Q4 FY26 EBITDA margin of 9.4% standalone a trough or a new normal?
    - Can BESS/solar/transmission execution match the company's highways track record?

history:
  - date: 2026-07-11
    note: Initial verdict — high-risk asymmetric bet on CBI resolution, HAM monetization, and margin recovery at 12.4x P/E.
