management_promises:
  - said: "30 GW by FY30 capacity target"
    when: 2024-06-01
    source: Q1 FY25 concall/investor presentation
    status: dropped
    note: Target grew 40% to 42 GW by FY32 (FY26 AR); goalposts moved repeatedly — 30 GW → 30+ GW by 2030 → 30.67 GW by FY30 → 23.5 GW addition → 23.7 GW by FY32 → 41.87 GW by FY32.
  - said: "Rs 8,000 Cr capex for FY25, Rs 13,000 Cr for FY26"
    when: 2025-04-01
    source: FY25 management guidance
    status: missed
    note: FY26 actual capex ~Rs 22,000-23,000 Cr (per Q4 FY26 call) — capex numbers consistently revised upward as scope grew; FY27 guided Rs 25,000 Cr, FY28 Rs 33,000 Cr.
  - said: "FY25 PLF 71%"
    when: 2025-05-01
    source: FY25 investor presentation
    status: kept
    note: FY25 PLF delivered at 71%; however FY26 fell to 67% on extended monsoons.
  - said: "Internal accruals cover 70-90% of Rs 2 lakh Cr capex"
    when: 2026-05-01
    source: FY26 investor presentation / concall
    status: pending
    note: 7-year projected FFO Rs 1,40,000 Cr vs capex Rs 2,02,000 Cr — gap of Rs 60,000 Cr to be debt-funded; net debt already up Rs 15,175 Cr YoY in FY26.
  - said: "Rs 50,000 Cr EBITDA by FY30-31"
    when: 2026-05-01
    source: FY26 investor presentation
    status: pending
    note: FY26 EBITDA Rs 23,431 Cr (~Rs 1.29 Cr/MW); target implies near-doubling — dependent on 42 GW commissioning and new PPA economics holding.
  - said: "Debt-free by FY32-33"
    when: 2026-05-01
    source: FY26 investor presentation
    status: pending
    note: Net debt rose to Rs 45,022 Cr (FY26) from Rs 31,023 Cr (FY25); CWIP jumped from Rs 12,104 Cr to Rs 35,053 Cr; debt-free requires FCF inflection post capex peak.
  - said: "Godda operations uninterrupted during Bangladesh political turmoil (Aug 2025)"
    when: 2026-05-01
    source: FY26 investor presentation
    status: kept
    note: 1,600 MW plant continued running through Aug 2025 turmoil; grid connectivity to India provides partial hedge.
  - said: "67% market share of SHAKTI coal-linked PPA bids (13,945 MW of 20,920 MW awarded)"
    when: 2026-05-01
    source: FY26 investor presentation
    status: kept
    note: PPA wins across Assam (3,200 MW), Bihar (2,400 MW), Maharashtra (3,200 MW incl. 1,600 MW recent), UP (1,600 MW), MP (2,920 MW), Karnataka (625 MW); 13,320 MW (56%) of pipeline tied up.

governance_flags:
  - Repeated capacity-target and capex guidance revisions — 30 GW by FY30 grew to 42 GW by FY32; FY26 capex ~Rs 22-23K Cr vs guided Rs 13,000 Cr; investors should question whether 42 GW target will also be revised.
  - Bangladesh single-counterparty concentration — Godda 25-year USD PPA with Bangladesh PDB; receivables at 1.5-2 months flagged as "regular" but geopolitical exposure underappreciated.
  - FY24 PAT of Rs 20,829 Cr inflated by Rs 9,322 Cr one-time regulatory claims income (Supreme Court April 2023 ruling on alternate fuel cost recovery) — normalized PAT closer to FY26's Rs 12,971 Cr.
  - No dividend since inception — all cash reinvested into growth; shareholder returns entirely capital-gain dependent.
  - Q4 FY26 PAT spike to Rs 4,271 Cr (+64% YoY) driven by lower tax rate (3% vs 16% in Q3) — likely one-time deferred tax adjustment, not operational.
  - Stock price CAGR partly momentum/Adani Group recovery-driven (1Y 79%, 3Y 64%, 5Y 59%, 10Y 44%) — premium multiple leaves little margin of safety at 32.7x trailing earnings / 6.4x book.

latest_review:
  date: 2026-07-17
  new_since_last: >
    First full analysis. Captured FY26 results (revenue Rs 54,241 Cr -3.5% YoY, EBITDA
    Rs 23,431 Cr, PAT Rs 12,971 Cr, FCF Rs -2,817 Cr), PLF decline to 67%, capacity target
    evolution to 41.87 GW by FY32, capex creep to Rs 25,000 Cr (FY27) / Rs 33,000 Cr (FY28),
    net debt rise to Rs 45,022 Cr, SHAKTI PPA dominance (67% share, 13,320 MW tied up),
    stressed-asset turnaround track record, Dhirauli captive mine (CY2026), and peer comparison.
  changed_my_view: >
    The stressed-asset turnaround and pre-ordering strategy are genuinely hard to replicate,
    but the market at 32.7x earnings with negative FCF is pricing in flawless execution of
    23.7 GW. The 8 GW FY30 ramp (from 2-3 GW/year) and the Rs 60,000 Cr funding gap are the
    underappreciated risks; FY27's 2.9 GW commissioning (Korba Phase-II from Q2 FY27) is the
    first real test. Bangladesh counterparty concentration on Godda is also underweighted.
  next_check: "Q2 FY27 results (Oct-Nov 2026): Korba Phase-II (1,320 MW) commissioning, FY27 PLF recovery, Net Debt/EBITDA vs 3x threshold, PPA signing cadence (Rajasthan/Gujarat/UP bids)."
  open_questions:
    - Will the FY30 ramp to 8 GW/year commissioning actually be executable, given no private thermal operator in India has done this scale before?
    - Does the 42 GW by FY32 target hold, or is another revision likely given the history of moving goalposts?
    - Can FCF turn positive before FY30, or does the Rs 60,000 Cr funding gap keep debt rising through the cycle?
    - Is Bangladesh PDB receivable position (1.5-2 months) genuinely stable, or is the "regular" framing masking deterioration?
    - Do new PPA capacity charges (Rs 4.11-4.30/kWh) hold as renewable penetration increases and DISCOMs push back?

history:
  - date: 2026-07-17
    note: Initial verdict — high-conviction thermal capex-cycle play with genuine moats, but 32.7x earnings with negative FCF prices in flawless 23.7 GW execution; FY27 Korba commissioning is the first test.
