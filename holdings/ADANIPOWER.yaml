thesis:
  summary: >
    India's largest private thermal producer (18,150 MW operating, 23,720 MW pipeline
    targeting 41,870 MW by FY32) riding the country's thermal capex cycle. Moats in fuel
    logistics, stressed-asset turnaround, and 67% share of SHAKTI PPA bids. At 32.7x
    trailing earnings with negative FY26 FCF entering a Rs 2 lakh Cr capex cycle, the
    market prices in flawless pipeline execution — first test is 2.9 GW in FY27.
  bull:
    - Pre-ordered BTG equipment for entire 23.7 GW pipeline (Rs 2 lakh Cr) before PPA signing gives a 2-3 year lead over competitors.
    - New PPAs signed at Rs 4.11-4.30/kWh capacity charges vs Rs 2.89/kWh in FY21, structurally lifting per-MW EBITDA.
    - Stressed-asset turnaround track record (7,450 MW revived) and 60% brownfield expansion lower per-MW cost and de-risk execution.
  bear:
    - 32.7x trailing earnings / 6.4x book with negative FCF leaves no margin of safety if FY27 commissioning slips.
    - Capacity target and capex guidance keep moving (30 GW by FY30 → 42 GW by FY32; FY26 capex Rs 22-23K Cr vs guided Rs 13,000 Cr).
    - Rs 60,000 Cr 7-year funding gap with FCF already negative means leverage must rise unless accruals outperform.
  pillars:
    - claim: 2.9 GW commissions in FY27 (Korba Phase-II 1,320 MW from Q2 FY27 plus partial Mahan), proving the 23.7 GW pipeline is executable on schedule.
      falsifier: FY27 commissioning falls materially short of 2.9 GW or Korba Phase-II slips beyond Q2 FY27.
      status: intact
    - claim: Untied 10,400 MW of new capacity secures PPAs at capacity charges of at least Rs 4.11/kWh, holding the structural uplift in per-MW EBITDA.
      falsifier: PPA win cadence stalls or capacity charges retreat toward FY21's Rs 2.89/kWh within the next 1-2 years.
      status: intact
    - claim: Internal accruals fund the bulk of the Rs 2 lakh Cr capex, keeping Net Debt/EBITDA below 3x through the cycle.
      falsifier: Net Debt/EBITDA breaches 3x or FCF stays negative beyond FY27 as capex peaks.
      status: intact

monitorables:
  - what: FY27 capacity commissioning (MW)
    why: Pillar 1 — first proof of pipeline execution; slippage delays EBITDA growth and undermines the premium multiple.
    threshold: 2900
  - what: Korba Phase-II commissioning quarter
    why: Pillar 1 — the first 1,320 MW unit is the leading indicator for the 23.7 GW ramp.
    threshold: 2
  - what: New PPA capacity charge tariff (Rs/kWh) on upcoming bids
    why: Pillar 2 — retreat toward Rs 2.89/kWh would break the per-MW EBITDA uplift assumption.
    threshold: 4.11
  - what: PPA wins vs untied capacity (MW signed)
    why: Pillar 2 — 10,400 MW untied must be progressively tied up; stall signals demand pushback.
    threshold: 10400
  - what: Net Debt/EBITDA
    why: Pillar 3 — breach of 3x during the capex cycle would signal the funding gap is closing on debt.
    threshold: 3
  - what: Free Cash Flow (Rs Cr)
    why: Pillar 3 — persistent negative FCF beyond FY27 means accruals are not covering capex as claimed.
    threshold: 0

